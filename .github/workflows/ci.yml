name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Static checks (same as `make lint`)
        run: make lint

  compose-e2e:
    name: compose e2e (${{ matrix.runner }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: make up
        run: make up
      - name: make smoke
        run: make smoke
      - name: Example Mine on top, smoke again
        run: |
          make example-mine
          make smoke
      - name: Restart keeps the Example Mine
        run: |
          make down
          make up
          make smoke
      - name: Memory actually used
        if: always()
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml ps -a
          docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=200
