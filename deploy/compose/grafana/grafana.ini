# Mirrors grafana.ini from the Helm values.
[plugins]
plugin_admin_enabled = true
allow_loading_unsigned_plugins = ertis-opentwins,ertis-unity-panel,ertis-opentwins-app
# Do not download Grafana's optional bundled apps at start (works offline).
preinstall_disabled = true

[navigation.app_sections]
ertis-opentwins-app = root -1700

[analytics]
reporting_enabled = false
check_for_updates = false

# Compose only (not in the Helm values). On its first start Grafana 12 starts
# about 30 services at once, and many of them write to the fresh SQLite file
# over many connections (the SQL store and unified storage each keep a pool).
# When two transactions both read and then try to write, SQLite answers one of
# them with "database is locked" at once instead of waiting (waiting would
# deadlock), so Grafana retries: a transaction 5 times 10 ms apart, a plain
# query not at all. On a loaded host a lock holder can be off the CPU for
# longer than 50 ms, the retries run out, a startup service fails and Grafana
# exits, which fails `make up` (`--wait`). These are Grafana's own SQLite-only
# settings for this error: give a transaction about 1 s (100 x 10 ms) and a
# query about 3 s (10 retries, backoff 10 ms to 1 s). Locking the database for
# every transaction instead (`_txlock=immediate`) deadlocks Grafana's
# migrations, and WAL mode does not remove these conflicts.
[database]
transaction_retries = 100
query_retries = 10
