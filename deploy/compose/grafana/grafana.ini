# Mirrors grafana.ini from the Helm values.
[plugins]
plugin_admin_enabled = true
allow_loading_unsigned_plugins = ertis-opentwins,ertis-unity-panel,ertis-opentwins-app
# Do not download Grafana's optional bundled apps at start (works offline).
preinstall_disabled = true

[navigation.app_sections]
ertis-opentwins-app = root -1700

[analytics]
reporting_enabled = false
check_for_updates = false
