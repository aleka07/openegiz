# Adapted from the Eclipse Ditto 3.3.7 Helm chart nginx config (EPL-2.0) used
# by the OpenEgiz Helm deployment, so both deployments expose the same API.
worker_processes 2;
events {
  worker_connections 1024;
}
http {
  charset utf-8;
  default_type application/json;
  include mime.types;
  # slightly above the gateway read-timeout of 60 seconds
  proxy_connect_timeout 70;
  proxy_send_timeout 70;
  proxy_read_timeout 70;
  send_timeout 70;
  client_header_buffer_size 8k;
  large_client_header_buffers 4 16k;
  merge_slashes off;

  map $http_authorization $authentication {
    default "Authentication required";
    "~Bearer" "off";
  }
  map $http_authorization $nginx_auth_user {
    default "nginx:${remote_user}";
    "~Bearer" "";
  }

  upstream ditto-gateway {
    server gateway:8080;
  }

  server {
    listen 80;
    server_name localhost;

    location / {
      index index.html;
    }

    location /api {
      include nginx-cors.conf;
      auth_basic                    $authentication;
      auth_basic_user_file          nginx.htpasswd;
      proxy_set_header              X-Forwarded-User          $remote_user;
      proxy_set_header              x-ditto-pre-authenticated $nginx_auth_user;
      proxy_pass                    http://ditto-gateway;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              X-Real-IP                 $remote_addr;
      proxy_set_header              X-Forwarded-For           $proxy_add_x_forwarded_for;
      proxy_set_header              Connection                '';
      chunked_transfer_encoding     off;
      proxy_buffering               off;
      proxy_cache                   off;
    }

    location /ws {
      auth_basic                    $authentication;
      auth_basic_user_file          nginx.htpasswd;
      proxy_set_header              X-Forwarded-User          $remote_user;
      proxy_set_header              x-ditto-pre-authenticated $nginx_auth_user;
      proxy_pass                    http://ditto-gateway;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              X-Real-IP                 $remote_addr;
      proxy_set_header              X-Forwarded-For           $proxy_add_x_forwarded_for;
      proxy_set_header              Upgrade                   $http_upgrade;
      proxy_set_header              Connection                "upgrade";
      proxy_read_timeout            1d;
      proxy_send_timeout            1d;
    }

    location /health {
      include nginx-cors.conf;
      access_log off;
      proxy_pass                    http://ditto-gateway/health;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
    }

    location /status {
      include nginx-cors.conf;
      access_log off;
      proxy_pass                    http://ditto-gateway/overall/status;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
    }

    location /stats {
      include nginx-cors.conf;
      access_log off;
      proxy_pass                    http://ditto-gateway/stats;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
    }

    location /devops {
      include nginx-cors.conf;
      proxy_pass                    http://ditto-gateway/devops;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
    }

    # Connections API: authenticated by the gateway's own devops user.
    location /api/2/connections {
      include nginx-cors.conf;
      proxy_pass                    http://ditto-gateway;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              X-Real-IP                 $remote_addr;
      proxy_set_header              X-Forwarded-For           $proxy_add_x_forwarded_for;
    }
  }
}
