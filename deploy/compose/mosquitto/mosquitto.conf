# Same broker settings as the Helm deployment: one anonymous listener.
# Anonymous access is why the compose stack binds its ports to 127.0.0.1 by
# default (see OPENEGIZ_BIND in .env).
listener 1883 0.0.0.0
allow_anonymous true
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
persistence true
persistence_location /mosquitto/data/
