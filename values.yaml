####################################################################################################################################
# OpenEgiz helm chart
# Based on OpenTwins by Julia Robles, Sergio Infante, Altair Bueno
# For local testing: helm install openegiz ./ --wait --timeout=15m --dependency-update --debug
####################################################################################################################################



# Example digital twin
##################################################################
example:
  enabled: false


# Persistent volumes
# Enabling these persistent volumes or not will depend on how your Kubernetes cluster works. 
# In our case, the cluster creates them automatically, so we don't need to activate them. 
# In other clusters we have seen that they are not created automatically, so to enable persistence it will be necessary to activate them.
##################################################################
persistentVolumes:
  grafana: false
  hono: false
  influxdb2: false



# OpenTwins connections
# Components can be automatically connected during installation.
##################################################################
connections:
  ditto:
    source:
      hono:
        enabled: true
        tenantName: ditto
        username: "ditto"
        password: "ditto"
      mosquitto:
        enabled: true
        address: "telemetry/#"
    target:
      mosquitto:
        enabled: true
        address: "opentwins/#"
      kafka:
        enabled: false
        topic: "opentwins"
  
  # The data received in Eclipse Ditto must be written to a messaging broker that acts as an intermediary with telegraf, the database collector. 
  # This broker can be Kafka (kafka) or Mosquitto (mqtt). 
  telegraf:
    source:
      mosquitto:
        enabled: true
    target:
      influxdb2:
        enabled: true       


# If you need to work with your own InfluxDB2 or connect more than one, you can add them here as a list.
# They will automatically connect to Grafana and Telegraf (if enabled).
externalInfluxdb2: {}
#  - name: anyName # Do not use hyphens or underscores
#    url: https://anyPlace/
#    bucket: anyBucket
#    organization: anyOrganization
#    token: anyToken


# If you need to work with your own Mosquitto or connect more than one, you can add them here as a list.
# Currently it only connects to Eclipse Ditto, although it is planned to allow it to replace the mosquitto that will be installed in the helm (and connect with Telegraf).
externalMosquitto: {}
#  - name: anyName # Do not use hyphens or underscores
#    uri: tcp://user:pass@hostname:1883 #{protocol}://{username}:{password}@{hostname}:{port}/{path}
#    addresses: 
#      - example/#
#      - example2/#


# OpenTwins recommended values for Eclipse Ditto
##################################################################
ditto:
  # OpenTwins custom values
  ####################################
  # Value to indicate if this component should be installed or not
  enabled: true 

  # Enables a workaround pod that cleans up stale connections that remain in a zombie state (neither open nor closed) after a crash.
  cleanupStaleConnections: true
  

  # Eclipse Ditto Helm Chart Values
  ####################################
  nameOverride: ditto
  global:
    hashedBasicAuthUsers: false
    # ----------------------------------------------
    # SECRETS ARE NOT STORED IN THIS FILE (rotated 2026-08-07).
    # The placeholders below are deliberately invalid so that a `helm upgrade`
    # without the secrets override fails loudly instead of silently restoring
    # the published upstream defaults (ditto/ditto, devops/foobar).
    # Real values live ONLY on the host:
    #   override file : ~/openegiz-deploy/secrets.values.yaml  (chmod 600)
    #   human copy    : ~/course/CREDENTIALS.md                (chmod 600)
    # Deploy with:  helm upgrade opentwins <chart> -n opentwins \
    #                 -f ~/openegiz-deploy/secrets.values.yaml
    # (`make upgrade` does this for you and refuses to run without the file.)
    # ----------------------------------------------
    basicAuthUsers:
      ditto:
        user: ditto
        password: REPLACE_ME_SEE_SECRETS_VALUES_FILE
      devops:
        user: devops
        password: REPLACE_ME_SEE_SECRETS_VALUES_FILE
    # ----------------------------------------------
    # Upstream default PLUS `-XX:MaxRAM=2147483648`. Everything else here is
    # verbatim from charts/ditto/values.yaml `global.jvmOptions`; this is a
    # scalar, so overriding it means restating the whole string.
    #
    # Why: on this host the JVM does not honour the cgroup v2 memory limit.
    # Inside a Ditto container `/sys/fs/cgroup/memory.max` correctly reads
    # 2147483648 and `/proc/self/cgroup` is `0::/`, but JDK 17.0.8.1 (Temurin,
    # aarch64 — the JDK baked into eclipse/ditto:3.3.7) still reports
    # `MaxRAM = 130596184064`, i.e. the full 121 GiB of host RAM. The chart then
    # applies `-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=60`, so the JVM
    # tries to COMMIT a ~73 GiB heap at startup and the kernel OOM-kills the
    # container about a second in (exit code 137). All five Ditto JVM services
    # died this way, and raising the k8s limit does nothing because the JVM
    # never looks at it.
    #
    # `-XX:MaxRAM` gives the ergonomics an explicit base to compute from, so
    # the percentages behave as the chart intends: 60 % of 2 GiB ≈ 1229 MiB heap.
    # Verified in-cluster: MaxHeapSize goes from 78383153152 to 1289748480.
    #
    # !! This value is coupled to `resources.memoryMi: 2048` on the five JVM
    # services below. Change both together, or the JVM will size its heap
    # against a limit the container does not actually have.
    # ----------------------------------------------
    jvmOptions: >
      -XX:+ExitOnOutOfMemoryError
      -XX:+UseContainerSupport
      -XX:MaxRAM=2147483648
      -XX:+UseStringDeduplication
      -Xss512k
      -XX:MaxMetaspaceSize=256m
      -XX:+UseG1GC
      -Djava.net.preferIPv4Stack=true
  nginx:
    service:
      type: NodePort
      nodePort: 30525
  swaggerui:
    enabled: false
  dittoui:
    enabled: false

  # ----------------------------------------------
  # Do not modify this unless you want to use your own mongodb or ditto mongodb. 
  # Opentwins can display two different mongodb charts. In case of displaying both, the bitnami one will take precedence.
  mongodb:
    enabled: false
    image: {}

  dbconfig:
    uriSecret: ditto-mongodb-connection-secret
  # ----------------------------------------------

  gateway:
    config:
      authentication:
        enablePreAuthentication: true
        devops:
          # Placeholders — real values in ~/openegiz-deploy/secrets.values.yaml
          devopsPassword: REPLACE_ME_SEE_SECRETS_VALUES_FILE
          statusPassword: REPLACE_ME_SEE_SECRETS_VALUES_FILE
    # See the memory note below.
    resources:
      memoryMi: 2048

  # ----------------------------------------------
  # Memory for the five Ditto JVM services. Upstream ships `memoryMi: 1024`,
  # used as BOTH the k8s request and the limit. 2048 pairs with the
  # `-XX:MaxRAM=2147483648` set in `global.jvmOptions` above: ~1229 MiB heap
  # + 256 MiB metaspace leaves ~560 MiB for code cache, thread stacks, GC
  # structures and Netty direct buffers. Cost is 10 GiB across the five pods,
  # which is nothing on a 121 GiB node.
  #
  # NOTE the upstream key is camelCase `thingsSearch` while the others are
  # lowercase. A `thingssearch:` block here would be silently ignored — Helm
  # does not warn about values that match no key in the subchart.
  # ----------------------------------------------
  things:
    resources:
      memoryMi: 2048
  thingsSearch:
    resources:
      memoryMi: 2048
  policies:
    resources:
      memoryMi: 2048
  connectivity:
    resources:
      memoryMi: 2048
  #connectivity:
  #  readinessProbe:
  #    initialDelaySeconds: 30
  #  livenessProbe:
  #    initialDelaySeconds: 80



# OpenTwins recommended values for Mosquitto
##################################################################
mosquitto:
  enabled: true # Value added by OpenTwins to indicate if this component should be installed or not
  nameOverride: mosquitto
  service:
    type: NodePort
    nodePort: 30511
  configuration:
    authentication:
      enabled: false



# OpenTwins recommended values for Kafka (DO NOT USE, IN DEVELOPMENT)
##################################################################
kafka:
  enabled: false

strimzi-kafka-operator: #(DO NOT USE, IN DEVELOPMENT)
  enabled: false
  installCRDs: true

# OpenTwins recommended values for Kafka-ML (DO NOT USE, IN DEVELOPMENT)
##################################################################
kafkaml:
  enabled: false
  image:
    repository: ertis
    pullPolicy: Always
    tag: "master"

  # Service Configuration
  # You can change type to NodePort, ClusterIP or LoadBalancer for each
  services:
    backend:
      type: NodePort
      port: 8000
      nodePort: 30527
    frontend:
      type: LoadBalancer
      port: 80
      nodePort: 
    pthexecutor:
      type: ClusterIP
      port: 8002
      nodePort: 
    tfexecutor:
      type: ClusterIP
      port: 8001
      nodePort: 

  # Infrastructure & App Config
  brokers: ""
  debug: "true"
  config:
    controlTopic: "KAFKA_ML_CONTROL_TOPIC"
    modelLoggerTopic: "FEDERATED_MODEL_CONTROL_TOPIC"
    frontendUrl: "http://localhost"
    backendAllowedHosts: "127.0.0.1,localhost"

  # Blockchain
  blockchain:
    enable: "0"
    rpcUrl: "http://blockchain:8000"
    chainId: "1337"
    networkId: "1999"
    walletAddress: "0x0"
    walletKey: "ffff"
    blockscoutUrl: "http://blockscout:8000"
    tokenName: "KafkaML-FedToken"
    tokenSymbol: "KFKMLA"
    

# OpenTwins recommended values for Telegraf
##################################################################
telegraf:
  enabled: true # Value added by OpenTwins to indicate if this component should be installed or not
  metrics:
    internal:
      enabled: false
  config:
# Do no modify
#!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    processors: [] 
    outputs: [] 
    inputs: [] 
  service:
    enabled: false 
  volumes:
    - name: my-config
      configMap:
        name: opentwins-telegraf-real-config
  volumeMounts:
    - name: my-config
      mountPath: /additional_config
  args:
    - "--config=/etc/telegraf/telegraf.conf"
    - "--config-directory=/additional_config"
#!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!


# OpenEgiz course scenario: the virtual bakery line
##################################################################
# The bakery simulator (examples/bakery/) emits two streams. Telemetry
# takes the normal Ditto path and needs nothing here. The process EVENT LOG
# bypasses Ditto — an event is a fact about the process, not a device state —
# so Telegraf needs a second mqtt_consumer to land it in its own measurement,
# and Grafana gets a dashboard that shows both streams side by side.
bakery:
  eventLog:
    enabled: true
    topic: "bakery/events"
    measurement: "batch_events"
  dashboard:
    enabled: true
    # UID of the Grafana datasource the panels query. Grafana derives the UID
    # of a provisioned datasource deterministically from its name, so this
    # value is stable for the datasource named "opentwins" that
    # cm-influxdb-grafana-datasource.yaml provisions. If you rename that
    # datasource, read the new UID from GET /api/datasources and put it here.
    datasourceUid: "P4528D75AB74BE2EA"


# OpenTwins recommended values for InfluxDB2
##################################################################
influxdb2:
  enabled: true # Value added by OpenTwins to indicate if this component should be installed or not
  nameOverride: influxdb2
  persistence:
    enabled: true
  service:
    type: NodePort
    nodePort: 30716
  image:
    pullPolicy: Always
  adminUser:
    organization: "opentwins"
    bucket: "default"
  # ----------------------------------------------
  # SECRETS ARE NOT STORED IN THIS FILE (rotated 2026-08-07).
  # Upstream shipped a fixed admin password and a fixed admin token here; both
  # were published verbatim in this public repo, so both were rotated. The
  # placeholders below are deliberately invalid — see the note under
  # `ditto.global.basicAuthUsers` for where the real values live.
  #
  # `token` is consumed by templates/config-maps/cm-telegraf.yaml and
  # templates/config-maps/cm-influxdb-grafana-datasource.yaml, so an upgrade
  # without the override file breaks telemetry ingest and the Grafana
  # datasource (loudly — that is the point).
  #
  # NOTE: the influxdb2 subchart applies `adminUser` only at FIRST bootstrap.
  # Changing these values does nothing to a running instance; the live
  # password/token must be changed through the influx API/CLI as well.
  # ----------------------------------------------
    password: REPLACE_ME_SEE_SECRETS_VALUES_FILE
    token: REPLACE_ME_SEE_SECRETS_VALUES_FILE
  # ----------------------------------------------



# OpenTwins recommended values for Grafana
##################################################################
# The OpenEgiz Grafana app plugin is a FRONTEND plugin: it calls Ditto and the
# extended API from the user's BROWSER, not from inside the cluster. Upstream
# hardcoded cluster-internal service DNS names here, which a browser outside
# the cluster cannot resolve — the Twins page then silently shows "No twins
# found". These URLs must be reachable from wherever users open Grafana
# (NodePorts on the host IP for this single-node LAN setup).
#
# Set publicHost to the IP or hostname browsers use to reach this host; the
# URLs are then built from the Ditto nginx and extended-API NodePorts.
# `make install` and bootstrap.sh fill it in from the node's InternalIP.
# dittoURL / extendedURL override the derived URLs (e.g. behind a proxy).
grafanaPlugin:
  publicHost: ""
  dittoURL: ""
  extendedURL: ""

grafana:
  enabled: true # Value added by OpenTwins to indicate if this component should be installed or not
  persistence:
    enabled: true
  # The chart's init-chown-data runs as root with all capabilities dropped
  # except CHOWN. On a fresh PVC that works, but once Grafana has created
  # its csv/pdf/png subdirs (mode 700, uid 472), recursive chown can no
  # longer traverse them without CAP_DAC_OVERRIDE — every upgrade after
  # first install then crashloops in Init. Ownership is already correct
  # (fsGroup 472), so the chown pass is unnecessary.
  initChownData:
    enabled: false
  service:
    type: NodePort
    nodePort: 30718
  adminUser: admin
  # Placeholder — real value in ~/openegiz-deploy/secrets.values.yaml.
  # Note Grafana stores the admin password in its own DB on the PVC after
  # first start, so changing this value alone does not change the live
  # password (`grafana cli admin reset-admin-password` does).
  adminPassword: REPLACE_ME_SEE_SECRETS_VALUES_FILE
  grafana.ini:
    plugins:
      plugin_admin_enabled: true
      allow_loading_unsigned_plugins: ertis-opentwins,ertis-unity-panel,ertis-opentwins-app
    navigation.app_sections:
      ertis-opentwins-app: root -1700
  sidecar:
    datasources:
      enabled: true
    plugins:
      enabled: true
    # Needed for the "Bakery Line" dashboard shipped in
    # templates/config-maps/cm-bakery-dashboard.yaml. The sidecar picks up any
    # ConfigMap in this namespace carrying the `grafana_dashboard` label and
    # files it under the folder below, so new course dashboards are just new
    # ConfigMaps — no Grafana UI clicking, no state on the PVC.
    dashboards:
      enabled: true
      label: grafana_dashboard
      provider:
        folder: "OpenEgiz"
        allowUiUpdates: true
  extraInitContainers:
  - name: install-opentwins-plugins
    image: busybox
    command:
      - /bin/sh
      - -c
      - |
        #!/bin/sh
        # No `set -e`: a failed download must NOT block Grafana startup when a
        # previously unpacked copy of the plugin already exists on the PVC
        # (e.g. booting after a power loss with no network). Fresh download
        # wins when reachable; cached copy is the fallback; only fail hard if
        # there is neither.
        mkdir -p /grafana-storage/plugins
        cd /grafana-storage/plugins
        for P in ertis-opentwins-app ertis-unity-panel; do
          if wget --no-cache --no-check-certificate -O "$P.zip" "https://raw.githubusercontent.com/aleka07/openegiz/main/vendor/grafana-plugins/$P.zip"; then
            unzip -o "$P.zip" && rm "$P.zip"
          elif [ -d "$P" ]; then
            echo "WARN: download of $P failed, keeping cached copy on PVC"
            rm -f "$P.zip"
          else
            echo "ERROR: $P unavailable: download failed and no cached copy" >&2
            exit 1
          fi
        done
    volumeMounts:
    - name: storage
      mountPath: /grafana-storage

# OpenTwins recommended values for Eclipse Hono
##################################################################
hono:
  nameHonoTenant: opentwins
  enabled: false # Value added by OpenTwins to indicate if this component should be installed or not
  nameOverride: hono
  prometheus:
    createInstance: false
  grafana:
    enabled: false
  useLoadBalancer: false
  probes:
    livenessProbe:
      initialDelaySeconds: 900
    readinessProbe:
      initialDelaySeconds: 45
  messagingNetworkTypes:
  - "amqp"
  kafka:
    auth:
      sasl:
        jaas:
          clientUsers:
            - "hono"
            - "ditto"
          clientPasswords:
            - "hono-secret"
            - "ditto"
  kafkaMessagingClusterExample:
    enabled: false
  amqpMessagingNetworkExample:
    enabled: true
  deviceRegistryExample:
    type: mongodb
    addExampleData: false
    # Increase memory limits for device registry to prevent OOMKilled
    resources:
      requests:
        cpu: "150m"
        memory: "400Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    mongoDBBasedDeviceRegistry:
      mongodb:
        host: '{{ .Release.Name }}-mongodb' # The values are processed via the 'tpl' function here in Eclipse Hono helm, allowing the inclusion of the release name
        port: 27017
        dbName: hono
      # Increase memory limits for MongoDB based registry
      resources:
        requests:
          cpu: "150m"
          memory: "400Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
    hono:
      registry:
        http:
          insecurePortEnabled: true
          insecurePortBindAddress: "0.0.0.0"
          authenticationRequired: false
  adapters: # This needs to be defined for the Eclipse Hono Helm to work (it seems to be a bug)
    mqtt:
      enabled: true
      hono:
        mqtt:
          insecurePortEnabled: true
    http:
      hono:
        http:
          insecurePortEnabled: true
    amqp:
      hono:
        amqp:
          insecurePortEnabled: true



# OpenTwins recommended values for bitnami MongoDB
# Disabled on arm64: bitnami/mongodb images are amd64-only, see plainMongodb below.
# Keep `nameOverride` as is, the `opentwins.mongodb.fullname` helper reads it.
##################################################################
mongodb:
  enabled: false
  nameOverride: mongodb
  # ClusterIP, same reasoning as plainMongodb below (no auth -> no NodePort).
  service:
    type: ClusterIP
  persistence:
    enabled: true
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
    tag: 6.0.10-debian-11-r8
  volumePermissions:
    enabled: true
    image: 
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 11-debian-11-r72


# Minimal plain-Kubernetes MongoDB (official image, multi-arch incl. arm64).
# Replaces the bitnami sub chart above. The Service is named after the
# `opentwins.mongodb.fullname` helper, so every existing consumer
# (ditto-mongodb-connection-secret, extended API, hono device registry)
# keeps resolving the same host name and port.
##################################################################
plainMongodb:
  enabled: true
  image: mongo:6.0
  imagePullPolicy: IfNotPresent
  # ClusterIP since 2026-08-07: MongoDB runs without authentication, so it must
  # not be reachable from outside the cluster. Every real consumer (Ditto via
  # ditto-mongodb-connection-secret, the extended API, the Hono device
  # registry) talks to it in-cluster over the service DNS name, so dropping the
  # NodePort (was 30717) costs nothing. For ad-hoc inspection from the host use
  # `kubectl port-forward -n opentwins svc/opentwins-mongodb 27017:27017`.
  service:
    type: ClusterIP
    port: 27017
  persistence:
    storageClass: local-path
    size: 8Gi
  resources: {}


# Unity WebGL Server
##################################################################
unityWebglServer:
  enabled: true
  image: nginx:alpine
  service:
    type: NodePort
    port: 80
    nodePort: 30530


# OpenTwins recommended values for Ditto Extended API
##################################################################
extendedAPI:
  enabled: true
  image:
    # Built locally on the ARM64 host from ertis-research/extended-api-for-eclipse-ditto
    # (see rebuild/extended-api/); upstream ertis/ditto-extended-api is amd64-only.
    repository: openegiz/ditto-extended-api
    tag: arm64-b49663d
    pullPolicy: IfNotPresent
  allLogs: false
  service:
    port: 8080
    nodePort: 30528
      

