{{- if .Values.plainMongodb.enabled }}
{{- $mongoName := include "opentwins.mongodb.fullname" . -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ $mongoName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ template "opentwins.name" . }}
    helm.sh/chart: {{ template "opentwins.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: mongodb
spec:
  type: {{ .Values.plainMongodb.service.type }}
  ports:
    - name: mongodb
      protocol: TCP
      port: {{ .Values.plainMongodb.service.port }}
      targetPort: mongodb
      {{- if and (eq .Values.plainMongodb.service.type "NodePort") .Values.plainMongodb.service.nodePort }}
      nodePort: {{ .Values.plainMongodb.service.nodePort }}
      {{- end }}
  selector:
    app: {{ $mongoName }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $mongoName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ template "opentwins.name" . }}
    helm.sh/chart: {{ template "opentwins.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: mongodb
spec:
  serviceName: {{ $mongoName }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ $mongoName }}
  template:
    metadata:
      labels:
        app: {{ $mongoName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mongodb
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.plainMongodb.image }}
          imagePullPolicy: {{ .Values.plainMongodb.imagePullPolicy }}
          args:
            - "--bind_ip_all"
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.plainMongodb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.plainMongodb.persistence.storageClass }}
        storageClassName: {{ .Values.plainMongodb.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.plainMongodb.persistence.size }}

{{- end }}
