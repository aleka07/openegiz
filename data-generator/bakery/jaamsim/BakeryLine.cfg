# ==========================================================================
# BakeryLine — BASELINE (as-is)
#
# A discrete-event model of the four-station bakery line:
#
#   Launch -> MixerQueue -> Mixer -> ProoferQueue -> Proofer
#          -> OvenQueue -> Oven -> PackerQueue -> Packer -> LeadTime -> Shipped
#
# Every number in the PARAMETERS block below came out of the process-mining
# notebook (mining.ipynb / mining.py), which read the real event log from
# InfluxDB. Nothing here was guessed.
#
# Run it:
#   bash ~/.hermes/skills/openegiz/jaamsim/scripts/run_jaamsim.sh \
#        ~/course/bakery/jaamsim/BakeryLine.cfg
#
# JaamSim exits 0 even when the run failed. Always use the wrapper.
# ==========================================================================

# --- object declarations (do not edit) ------------------------------------
Define LogNormalDistribution { ArrivalDist MixerDist ProoferDist OvenDist PackerDist }
Define EntityGenerator       { Launch }
Define Queue                 { MixerQueue ProoferQueue OvenQueue PackerQueue }
Define EntityProcessor       { Mixer Proofer Oven Packer }
Define Statistics            { LeadTime }
Define EntitySink            { Shipped }
Define SimEntity             { Batch }

ArrivalDist UnitType { TimeUnit }
MixerDist   UnitType { TimeUnit }
ProoferDist UnitType { TimeUnit }
OvenDist    UnitType { TimeUnit }
PackerDist  UnitType { TimeUnit }
LeadTime    UnitType { TimeUnit }

# ==========================================================================
# PARAMETERS — EDIT HERE (from mining)
# --------------------------------------------------------------------------
# Source: mining.py --summary, table "PARAMETERS FOR JAAMSIM", dataset
# batch-0001..batch-0020 (mode=normal, 160 events, 20 complete cases).
#
# How to read a line: JaamSim draws  Scale * exp(NormalMean + Sigma * Z).
# NormalMean is 0 everywhere, so  Scale = the MEDIAN duration in minutes  and
# NormalStandardDeviation = the spread in log space. Copy the two numbers
# straight out of the mining table; change nothing else.
#
#   station    capacity   mined mean   -> Scale (median)   sigma
#   mixer-1        1         8.08            7.85          0.112
#   proofer-1      3        39.11           38.99          0.118
#   oven-1         1        25.67           24.93          0.153
#   packer-1       1         4.98            4.96          0.111
#   arrivals       -        12.80           12.53          0.133
# ==========================================================================

# --- how often a new batch is released to the line ---
ArrivalDist Scale                   { 12.53 min }
ArrivalDist NormalMean              { 0 }
ArrivalDist NormalStandardDeviation { 0.133 }

# --- mixing ---
Mixer     Capacity                { 1 }
MixerDist Scale                   { 7.85 min }
MixerDist NormalMean              { 0 }
MixerDist NormalStandardDeviation { 0.112 }

# --- proofing ---
Proofer     Capacity                { 3 }
ProoferDist Scale                   { 38.99 min }
ProoferDist NormalMean              { 0 }
ProoferDist NormalStandardDeviation { 0.118 }

# --- baking  (this is the constraint: 24.93 min of work, capacity 1) ---
Oven     Capacity                { 1 }
OvenDist Scale                   { 24.93 min }
OvenDist NormalMean              { 0 }
OvenDist NormalStandardDeviation { 0.153 }

# --- packing ---
Packer     Capacity                { 1 }
PackerDist Scale                   { 4.96 min }
PackerDist NormalMean              { 0 }
PackerDist NormalStandardDeviation { 0.111 }

# --- shift length and how many times to repeat it ---
Simulation RunDuration            { 540 min }
Simulation NumberOfReplications   { 3 }

# ==========================================================================
# END OF PARAMETERS — everything below is wiring, leave it alone
# ==========================================================================

ArrivalDist RandomSeed { 1 }
MixerDist   RandomSeed { 2 }
ProoferDist RandomSeed { 3 }
OvenDist    RandomSeed { 4 }
PackerDist  RandomSeed { 5 }

Launch NextComponent    { MixerQueue }
Launch InterArrivalTime { ArrivalDist }
Launch PrototypeEntity  { Batch }
Launch BaseName         { Batch }

Mixer   WaitQueue { MixerQueue }
Mixer   ServiceTime   { MixerDist }
Mixer   NextComponent { ProoferQueue }

Proofer WaitQueue     { ProoferQueue }
Proofer ServiceTime   { ProoferDist }
Proofer NextComponent { OvenQueue }

Oven    WaitQueue     { OvenQueue }
Oven    ServiceTime   { OvenDist }
Oven    NextComponent { PackerQueue }

Packer  WaitQueue     { PackerQueue }
Packer  ServiceTime   { PackerDist }
Packer  NextComponent { LeadTime }

LeadTime SampleValue   { this.obj.TotalTime }
LeadTime NextComponent { Shipped }

Simulation Description { 'Bakery line, baseline: one oven, 40-min proofing' }
Simulation PrintReport { TRUE }
Simulation RunOutputList { { [Shipped].NumberAdded } { [LeadTime].SampleAverage/1[min] } { [OvenQueue].QueueLengthAverage } { [OvenQueue].QueueLengthMaximum } { [OvenQueue].AverageQueueTime/1[min] } { [Oven].UnitsInUseAverage } { [ProoferQueue].AverageQueueTime/1[min] } { [Proofer].UnitsInUseAverage } }
