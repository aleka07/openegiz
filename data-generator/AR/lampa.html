<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Lightbulb & Digital Twin</title>
  
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://aframe.io/ https://raw.githack.com/ https://cdnjs.cloudflare.com/;">
  
  <!-- Подключаем A-Frame и AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Подключаем библиотеку Paho MQTT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  
  <!-- Скрипт для поворота панели к камере -->
  <script>
    AFRAME.registerComponent('arjs-billboard', {
      tick: function () {
        if (!this.el.parentElement || !this.el.parentElement.object3D.visible) return;
        var camera = this.el.sceneEl.camera;
        if (!camera) return;
        var cameraPosition = new THREE.Vector3();
        camera.getWorldPosition(cameraPosition);
        var objectPosition = new THREE.Vector3();
        this.el.object3D.getWorldPosition(objectPosition);
        if (cameraPosition.distanceTo(objectPosition) < 0.01) return;
        this.el.object3D.lookAt(cameraPosition);
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

    <a-assets timeout="10000">
      <a-asset-item id="bulb-obj" src="lampa.obj"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="lampa.patt">
      
      <!-- Лампочка -->
      <a-entity 
        obj-model="obj: #bulb-obj;" 
        position="0 0.1 0" 
        scale="1 1 1"
        rotation="-90 0 0" 
        material="color: #FFEB3B"> 
      </a-entity>

      <!-- Информационная панель -->
      <a-entity position="0 1 -2" arjs-billboard>
        <a-plane width="2.8" height="1.8" color="#0a1a0a" opacity="0.85"></a-plane>
        
        <a-plane width="2.9" height="0.05" color="#00CCFF" position="0 0.9 0"></a-plane>
        <a-plane width="2.9" height="0.05" color="#00CCFF" position="0 -0.9 0"></a-plane>
        
        <a-text id="sensor-data" 
                value="[ ОЖИДАНИЕ ДАННЫХ... ]" 
                position="-1.2 0 0.05" 
                color="#00FF66" 
                width="2.6" 
                font="monoid" 
                wrap-count="25">
        </a-text>
      </a-entity>
      
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- === СКРИПТ ДАННЫХ ИЗ OPENEgiz / DITTO === -->
  <script>
  function formatNumber(value, digits) {
      if (value === undefined || value === null || value === '') return '--';
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed.toFixed(digits) : '--';
    }

    function updatePanel(features) {
      const textElement = document.querySelector('#sensor-data');
      if (textElement) {
        const brightness = formatNumber(features.brightness?.properties?.value, 1);
        const power = formatNumber(features.power_consumption?.properties?.value, 2);
        const voltage = formatNumber(features.voltage?.properties?.value, 1);
        const temperature = formatNumber(features.temperature?.properties?.value, 1);
        const timestamp = features.voltage?.properties?.timestamp || features.brightness?.properties?.timestamp || '--';

        const newText = `[ STATUS: ONLINE ]\n\nBrightness: ${brightness} lm\nPower:      ${power} W\nVoltage:    ${voltage} V\nTemp:       ${temperature} C\n\n${timestamp}`;
        textElement.setAttribute('value', newText);
      }
    }

    async function refreshLightbulb() {
      try {
        const response = await fetch('/api/lightbulb', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const features = await response.json();
        updatePanel(features);
      } catch (e) {
        console.error("Ошибка получения данных OpenEgiz:", e);
        const textElement = document.querySelector('#sensor-data');
        if (textElement) textElement.setAttribute('value', '[ СВЯЗЬ С OPENEgiz ПОТЕРЯНА ]');
      }
    }

    refreshLightbulb();
    setInterval(refreshLightbulb, 1000);
  </script>

</body>
</html>
