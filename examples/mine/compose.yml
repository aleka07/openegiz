# Example Mine: an overlay on deploy/compose/docker-compose.yml.
# Started by `make example-mine` from the repository root.

services:
  mine-setup:
    build: ../../examples/mine
    image: openegiz/example-mine:local
    restart: "no"
    command: ["python", "setup_twins.py"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully

  # Same image as mine-setup, which builds it. Only one service may have
  # `build:` for a given image: Compose builds every such service at once, and
  # with Docker's containerd image store the second tag write fails with
  # 'image "docker.io/openegiz/example-mine:local": already exists'. Compose
  # builds all images before it creates any container, so the image exists by
  # the time this service starts; `pull_policy: never` stops Compose from
  # trying to pull a local-only image from Docker Hub first.
  mine-simulator:
    image: openegiz/example-mine:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SIM_SPEEDUP: ${SIM_SPEEDUP:-10}
    depends_on:
      mine-setup:
        condition: service_completed_successfully

  grafana:
    volumes:
      - ../../examples/mine/dashboard.json:/var/lib/grafana/example-dashboards/example-mine.json:ro
